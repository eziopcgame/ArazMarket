name: Build Araz Market APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Install MAUI Workload
        run: dotnet workload install maui-android
      - name: Build APK
        run: dotnet publish ArazMarket/ArazMarket.csproj -f net9.0-android -c Release -p:AndroidPackageFormat=apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArazMarket-APK
          path: ArazMarket/bin/Release/net9.0-android/publish/*.apk
