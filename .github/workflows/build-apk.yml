name: Build Araz Market APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - rid: android-arm64
            artifact_name: ArazMarket-APK-Modern
          - rid: android-arm
            artifact_name: ArazMarket-APK-Legacy

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI Android Workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore ArazMarket/ArazMarket.csproj

      - name: Publish APK (${{ matrix.rid }})
        run: dotnet publish ArazMarket/ArazMarket.csproj -f net9.0-android -c Release -p:AndroidPackageFormat=apk -r ${{ matrix.rid }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ArazMarket/bin/Release/net9.0-android/${{ matrix.rid }}/publish/*.apk
          if-no-files-found: error
          retention-days: 14
