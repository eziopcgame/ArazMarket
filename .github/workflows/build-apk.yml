name: Build Araz Market APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install MAUI workload
      run: dotnet workload install maui-android

    - name: Restore dependencies
      run: dotnet restore ArazMarket/ArazMarket.csproj

    - name: Build APK
      run: dotnet publish ArazMarket/ArazMarket.csproj -f net8.0-android -c Release -p:AndroidPackageFormats=apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ArazMarket-APK
        path: ArazMarket/bin/Release/net8.0-android/publish/*.apk
